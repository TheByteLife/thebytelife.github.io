<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rock+Salt&amp;family=Rubik+Glitch&amp;display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.colors.min.css">
    <title>The Byte Life</title>
    <style>
      body {
        background: linear-gradient(135deg, var(--pico-primary-background), var(--pico-background-color));
      }
      .hero {
        min-height: 100svh; 
        place-items: center;
      }
      .hero h1 {
        font-family: "Rubik Glitch", system-ui;
        font-weight: 400;
        font-style: normal;
        font-size: 8rem;
      }
      .hero .by {
        text-align: right;
        position: relative;
        top: -55px;
      }
      .hero .name {
        font-family: "Rock Salt", cursive;
        font-weight: 400;
        font-style: normal;
        font-size: 1.2em;
      }
    </style>
  </head>
  <body>
    <main class="container grid hero">
      <div>
        <h1>The Byte Life</h1>
        <p class="by">by <span class="name">Kyuzo Nakamaru</span></p>
        <p style="text-align: center;">coming soon...</p>
      </div>
    </main>
  </body>
</html>
